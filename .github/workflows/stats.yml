name: Actualizar estadísticas

on:
  schedule:
    - cron: "0 6 * * *" # diario, 06:00 UTC
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-stats.mjs

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar SVG
        env:
          # PAT con permiso read:user (opcional). Sin él se usa el token por defecto
          # y solo se cuentan contribuciones públicas.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GH_LOGIN: EHM2396
        run: node scripts/generate-stats.mjs

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || git commit -m "chore: actualizar estadísticas" && git push
